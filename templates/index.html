<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rave Player</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/art/icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="halftone" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/latest">
      <span class="mark">◆</span>
      <span class="name">RAVE<em>PLAYER</em></span>
      <span class="tag">93/94 · JUNGLE · HARDCORE</span>
    </a>
    <form class="search" id="search-form" autocomplete="off">
      <input id="search-input" type="search" placeholder="Search the archive…" aria-label="Search the archive">
      <button type="submit" aria-label="Search">⏎</button>
    </form>
    <div class="status" id="status">READY</div>
  </header>

  <nav class="rail" id="nav" aria-label="Sections">
    <span class="rail-loading">Loading sections…</span>
  </nav>

  <main class="stage">
    <div class="stage-head">
      <h1 id="title">Latest</h1>
      <button class="back" id="back" hidden>← Back</button>
    </div>
    <div id="list" class="list" aria-live="polite"></div>
    <div id="more" class="more" hidden><button id="more-btn">Load more</button></div>
    <div id="empty" class="empty" hidden>Nothing here — try another section.</div>
  </main>

  <footer class="player" id="player" hidden>
    <img id="p-art" class="p-art" src="/static/art/radio.png" alt="">
    <div class="p-meta">
      <div class="p-title" id="p-title">—</div>
      <div class="p-sub" id="p-sub"></div>
    </div>
    <div class="p-controls">
      <button id="p-prev" aria-label="Previous">⏮</button>
      <button id="p-play" class="p-play" aria-label="Play/pause">▶</button>
      <button id="p-next" aria-label="Next">⏭</button>
    </div>
    <div class="p-seek">
      <span id="p-time">0:00</span>
      <input id="p-range" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <span id="p-dur">0:00</span>
    </div>
    <div class="p-extra">
      <span id="p-queue" class="queue">0 in queue</span>
      <button id="p-fav" class="fav" aria-label="Add to favourites">♡</button>
      <button id="p-close" aria-label="Close player">✕</button>
    </div>
    <audio id="audio" preload="none"></audio>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
