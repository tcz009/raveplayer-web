name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the offline test suite
        run: python -m pytest test -q
      - name: Check the front-end JavaScript
        run: node --check static/app.js

  browser:
    # Kept out of the offline job: this needs Chromium (~2 min) and exists to
    # catch what unit tests cannot (CSP/embed panel, paste-a-set, boot/nav).
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run the headless-browser smoke tests
        env:
          # A missing/broken Chromium must fail this job, not skip silently.
          RAVEWEB_REQUIRE_BROWSER: "1"
        run: python -m pytest test_e2e -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t raveplayer-web:ci .
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8097:8097 -e RAVEWEB_DATA=/tmp/data raveplayer-web:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8097/healthz; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke || true
