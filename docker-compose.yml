services:
  raveplayer-web:
    build: .
    container_name: raveplayer-web
    restart: unless-stopped
    ports:
      - "8097:8097"
    volumes:
      - ./data:/data
    environment:
      RAVEWEB_DATA: /data
      RAVEWEB_ALLOW_PRIVATE: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8097/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
